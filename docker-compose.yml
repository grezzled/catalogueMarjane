version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marjanecatalogue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marjanecatalogue?schema=public
      AI_PROVIDER: gemini
      AI_MODEL: gemini-2.0-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - db

  worker:
    build: .
    command: npm run worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marjanecatalogue?schema=public
      AI_PROVIDER: gemini
      AI_MODEL: gemini-2.0-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: ./public/uploads
    depends_on:
      - db
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
