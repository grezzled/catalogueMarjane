# SQLite-only stack — no Postgres.
# The database is a single file (/data/prod.db) on a shared named volume,
# so data survives restarts and both services see the same DB.
# public/sitemap.xml is served from the shared uploads-free codebase volume
# and refreshed by `npm run sitemap` / the worker — no rebuild needed.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cataloguemarjane.com}
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      DATABASE_URL: file:/data/prod.db
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cataloguemarjane.com}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    volumes:
      - sqlite-data:/data
      - uploads:/app/public/uploads
    command: sh -c "npx prisma db push && npm start"

  worker:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/prod.db
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cataloguemarjane.com}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: ./public/uploads
    volumes:
      - sqlite-data:/data
      - uploads:/app/public/uploads
    depends_on:
      - app
    command: sh -c "sleep 10 && npm run worker"

volumes:
  sqlite-data:
  uploads:
